<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    <title>Apple Shop Checkout | Bootstrap</title>
  </head>
  <body>
    <header class="header d-flex align-items-start justify-content-center gap-3">
      <h1 class="text-white fw-bold mb-0">Checkout</h1>
      <span class="badge rounded-pill bg-dark align-self-start mt-1">3 ITEMS</span>
    </header>

    <main class="container checkout-wrapper">
      <div class="row g-0 checkout-card shadow overflow-hidden rounded-4">
        <!-- Product Summary Section -->
        <section class="col-12 col-md-6 summary p-4 p-lg-5" aria-label="Order summary">
          <ul class="product-list list-unstyled d-flex flex-column gap-4 mb-0">
            <li class="product d-flex gap-3">
              <div class="product-image flex-shrink-0 d-flex align-items-center justify-content-center">
                <img src="resources/Gold.png" srcset="resources/Gold.png 1x, resources/Gold@2x.png 2x" alt="iPhone 12 Pro Golden" class="img-fluid" />
              </div>
              <div class="product-details flex-grow-1 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start gap-2">
                  <div>
                    <h2 class="product-name h6 fw-semibold mb-0">iPhone 12 Pro</h2>
                    <p class="product-color small mb-0">Golden</p>
                  </div>
                  <p class="product-price fw-semibold mb-0">$999.00</p>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-auto pt-2">
                  <span class="product-qty small">x 1</span>
                  <button type="button" class="remove-btn border-0 bg-transparent p-0" aria-label="Remove iPhone 12 Pro">
                    <img src="resources/close-icon.svg" alt="" width="18" height="18" />
                  </button>
                </div>
              </div>
            </li>
            <li class="product d-flex gap-3">
              <div class="product-image flex-shrink-0 d-flex align-items-center justify-content-center">
                <img src="resources/Apple-watch.png" srcset="resources/Apple-watch.png 1x, resources/Apple-watchx2.png 2x" alt="Apple Watch Blue" class="img-fluid" />
              </div>
              <div class="product-details flex-grow-1 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start gap-2">
                  <div>
                    <h2 class="product-name h6 fw-semibold mb-0">Apple Watch</h2>
                    <p class="product-color small mb-0">Blue</p>
                  </div>
                  <p class="product-price fw-semibold mb-0">$399.00</p>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-auto pt-2">
                  <span class="product-qty small">x 1</span>
                  <button type="button" class="remove-btn border-0 bg-transparent p-0" aria-label="Remove Apple Watch">
                    <img src="resources/close-icon.svg" alt="" width="18" height="18" />
                  </button>
                </div>
              </div>
            </li>
            <li class="product d-flex gap-3">
              <div class="product-image flex-shrink-0 d-flex align-items-center justify-content-center">
                <img src="resources/iMac.png" srcset="resources/iMac.png 1x, resources/iMac@2x.png 2x" alt="iMac Green" class="img-fluid" />
              </div>
              <div class="product-details flex-grow-1 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start gap-2">
                  <div>
                    <h2 class="product-name h6 fw-semibold mb-0">iMac</h2>
                    <p class="product-color small mb-0">Green</p>
                  </div>
                  <p class="product-price fw-semibold mb-0">$1199.00</p>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-auto pt-2">
                  <span class="product-qty small">x 1</span>
                  <button type="button" class="remove-btn border-0 bg-transparent p-0" aria-label="Remove iMac">
                    <img src="resources/close-icon.svg" alt="" width="18" height="18" />
                  </button>
                </div>
              </div>
            </li>
          </ul>

          <hr class="divider my-4" />

          <form class="coupon-form d-flex flex-row gap-2 mb-4" onsubmit="return false;">
            <input type="text" name="coupon" class="form-control coupon-input" placeholder="Enter coupon code" aria-label="Coupon code" />
            <button type="submit" class="btn btn-dark coupon-btn fw-semibold px-3 px-sm-4">Apply Coupon</button>
          </form>

          <div class="totals d-flex flex-column gap-2">
            <div class="d-flex justify-content-between total-row">
              <span>Sub total</span>
              <span>$2597.00</span>
            </div>
            <div class="d-flex justify-content-between total-row">
              <span>Tax</span>
              <span>$623.28</span>
            </div>
            <div class="d-flex justify-content-between total-row total-final fw-bold">
              <span>Total</span>
              <span>$3220.28</span>
            </div>
          </div>
        </section>

        <!-- Contact Form Section -->
        <section class="col-12 col-md-6 contact p-4 p-lg-5 bg-white" aria-label="Contact information">
          <h2 class="contact-title h5 fw-semibold mb-4">Contact Information</h2>
          <form class="contact-form d-flex flex-column h-100" onsubmit="return false;">
            <div class="mb-3">
              <label for="name" class="form-label small fw-medium">First &amp; Last name</label>
              <input type="text" class="form-control custom-input" id="name" name="name" placeholder="Enter first &amp; last name" required autocomplete="name" />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label small fw-medium">Email Address</label>
              <input type="email" class="form-control custom-input" id="email" name="email" placeholder="Enter email address" required autocomplete="email" />
            </div>
            <div class="row g-3 mb-4">
              <div class="col-6">
                <label for="country" class="form-label small fw-medium">Country</label>
                <select id="country" name="country" class="form-select custom-input" required>
                  <option value="Finland" selected>Finland</option>
                  <option value="United States">United States</option>
                  <option value="United Kingdom">United Kingdom</option>
                  <option value="Germany">Germany</option>
                  <option value="Canada">Canada</option>
                  <option value="Australia">Australia</option>
                </select>
              </div>
              <div class="col-6">
                <label for="postal" class="form-label small fw-medium">Postal Code</label>
                <input type="text" class="form-control custom-input" id="postal" name="postal" placeholder="00270" value="00270" required autocomplete="postal-code" />
              </div>
            </div>
            <button type="submit" class="btn btn-dark continue-btn w-100 fw-semibold mt-auto">Continue</button>
          </form>
        </section>
      </div>
    </main>

    <footer class="author-info text-center py-4">
      Coded by <a href="#" class="text-decoration-none fw-medium"> Odinaka </a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank" rel="noopener" class="text-decoration-none fw-medium">devChallenges.io</a>.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
